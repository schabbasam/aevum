[package]
name = "aevum"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true

# for web version
[lib]
#path = "src/main.rs"
#crate-type = ["cdylib"]
name = "aevum"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
